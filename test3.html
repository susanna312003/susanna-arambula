<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | 3D Modelling & GIS</title>
  <style>
    /* CSS Variables & Global Reset */
    :root {
      --bg-color: #ffffff;
      --text-main: #111111;
      --text-muted: #555555;
      --border: #dddddd;
      --max-width: 1000px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 0 1.5rem;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* Header / Profile Section */
    header {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--border);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .profile-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .profile-text h1 {
      font-size: 2.25rem;
      font-weight: normal;
      margin-bottom: 0.5rem;
    }

    .profile-text p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 650px;
    }

    /* Gallery Sections */
    section {
      padding: 3.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    section:last-of-type {
      border-bottom: none;
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: normal;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Pure Image Grid */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .image-grid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--border);
    }

    /* Footer */
    footer {
      padding: 3rem 0;
      text-align: center;
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* Responsive Adjustments */
    @media (max-width: 640px) {
      .profile {
        flex-direction: column;
        text-align: center;
        gap: 1.5rem;
      }

      .profile-text p {
        margin: 0 auto;
      }

      .image-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Profile / Intro Header -->
    <header>
      <div class="profile">
        <img src="images/profile.jpg" alt="Profile Picture" class="profile-img">
        <div class="profile-text">
          <h1> Your Name </h1>
          <p> Short description about yourself, your background, and your focus across 3D modelling, rendering, and GIS mapping. </p>
        </div>
      </div>
    </header>

    <!-- Section 1: 3D Modelling and Rendering -->
    <section id="3d-modelling">
      <h2 class="section-title">3D Modelling and Rendering</h2>
      <div class="image-grid">
        <img src="images/3d-1.jpg" alt="3D Model Work 1">
        <img src="images/3d-2.jpg" alt="3D Model Work 2">
        <img src="images/3d-3.jpg" alt="3D Model Work 3">
        <img src="images/3d-4.jpg" alt="3D Model Work 4">
        <img src="images/3d-5.jpg" alt="3D Model Work 5">
        <img src="images/3d-6.jpg" alt="3D Model Work 6">
      </div>
    </section>

    <!-- Section 2: GIS Work -->
    <section id="gis-work">
      <h2 class="section-title">GIS Work</h2>
      <div class="image-grid">
        <img src="images/gis-1.jpg" alt="GIS Work 1">
        <img src="images/gis-2.jpg" alt="GIS Work 2">
        <img src="images/gis-3.jpg" alt="GIS Work 3">
        <img src="images/gis-4.jpg" alt="GIS Work 4">
        <img src="images/gis-5.jpg" alt="GIS Work 5">
        <img src="images/gis-6.jpg" alt="GIS Work 6">
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Your Name</p>
    </footer>
  </div>

</body>
</html>
